<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Chewy&family=Bungee&family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        @keyframes floatAnimation {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        #app {
            opacity: 0;
            animation: fadeInUp 0.8s ease-out 0.1s forwards;
        }

        @keyframes jiggle {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(0.5deg); }
            75% { transform: rotate(-0.5deg); }
        }

        body {
            background: linear-gradient(135deg, #FFD700 0%, #FF69B4 100%);
            font-family: 'Chewy', cursive;
        }

        .bubble-card {
            border: 4px solid #1a202c;
            border-radius: 1.5rem;
            box-shadow: 8px 8px 0px 0px #4299e1, 12px 12px 0px 0px #f6e05e;
            transition: transform 0.15s ease-out;
        }

        .input-box {
            border: 4px dashed #4299e1;
            background-color: #ffffff;
            color: #1a202c;
            font-family: 'Bungee', cursive;
        }

        .bangla-text {
            font-family: 'Hind Siliguri', 'Chewy', sans-serif !important;
        }

        .font-style-box {
            background-color: #ffffff;
            border: 3px solid #1a202c;
            border-radius: 0.75rem;
            min-height: 120px;
            box-shadow: 4px 4px 0px 0px #FF69B4;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.15s;
        }
        
        .font-style-box:hover {
            animation: jiggle 0.2s ease-in-out infinite;
            transform-origin: center;
        }

        .action-button {
            background-color: #4299e1;
            color: #ffffff;
            border: 2px solid #1a202c;
            border-radius: 0.5rem;
            box-shadow: 2px 2px 0px 0px #1a202c;
            transition: all 0.1s;
        }
        .action-button:hover {
            background-color: #3182ce;
            box-shadow: 1px 1px 0px 0px #1a202c;
            transform: translate(1px, 1px);
        }
        
        .full-width-footer {
            background-color: #f6e05e;
            border-top: 6px solid #1a202c;
            box-shadow: 0 -8px 0 0 #4299e1;
            height: 140px;
            animation: floatAnimation 4s ease-in-out infinite;
        }

        .brand-text:hover {
            transform: scale(1.05);
            text-shadow: 2px 2px 0 #FF69B4;
            transition: all 0.15s ease-out;
        }

        /* Compact Three Dot Menu Button */
        .menu-btn {
            border: 2px solid #1a202c;
            background-color: #ffffff;
            box-shadow: 2px 2px 0px 0px #1a202c;
            transition: all 0.15s ease;
        }
        .menu-btn:hover {
            background-color: #fef08a;
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px 0px #1a202c;
        }

        .dropdown-card {
            border: 3px solid #1a202c;
            box-shadow: 4px 4px 0px 0px #1a202c;
        }
    </style>
</head>
<body class="p-4 sm:p-8">

    <div id="app" class="max-w-6xl mx-auto space-y-8 pb-16">
        
        <!-- Header area with compact top-right Three-Dot Menu -->
        <header class="text-center mb-8 relative pt-2">
            <!-- Three Dot Menu (Small & positioned neatly so it doesn't overlap title) -->
            <div class="absolute top-0 right-0 z-50">
                <button id="menu-toggle-btn" onclick="toggleLanguageMenu(event)" class="menu-btn w-8 h-8 rounded-full flex items-center justify-center text-gray-800" title="Choose Language / ভাষা নির্বাচন">
                    <i data-lucide="more-vertical" class="w-4 h-4"></i>
                </button>

                <!-- Dropdown Menu -->
                <div id="lang-dropdown" class="hidden absolute right-0 mt-2 w-40 bg-white rounded-xl dropdown-card py-2 z-50 text-left font-sans">
                    <button onclick="switchLanguage('en')" class="w-full px-4 py-2 text-sm font-bold text-gray-800 hover:bg-yellow-100 flex items-center justify-between transition-colors">
                        <span class="flex items-center gap-2">🇬🇧 English</span>
                        <span id="check-en" class="text-green-600 font-extrabold text-xs">✓</span>
                    </button>
                    <div class="border-t border-gray-200 my-1"></div>
                    <button onclick="switchLanguage('bn')" class="w-full px-4 py-2 text-sm font-bold text-gray-800 hover:bg-yellow-100 flex items-center justify-between transition-colors">
                        <span class="flex items-center gap-2">🇧🇩 বাংলা</span>
                        <span id="check-bn" class="hidden text-green-600 font-extrabold text-xs">✓</span>
                    </button>
                </div>
            </div>

            <h1 id="app-heading" class="text-4xl sm:text-6xl text-white tracking-widest leading-none" style="text-shadow: 6px 6px 0 #1a202c; font-family: 'Luckiest Guy', cursive;">
                FONT GENERATOR
            </h1>
            <p id="app-subheading" class="mt-2 text-xl font-bold text-gray-800">
                Generate 80+ font styles instantly.
            </p>
        </header>

        <div class="p-6 bubble-card bg-yellow-100">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 mb-3">
                <label id="input-label" for="text-input" class="block text-xl sm:text-2xl font-extrabold text-gray-800" style="font-family: 'Luckiest Guy', cursive;">
                    TYPE YOUR TEXT:
                </label>
                <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                    <button onclick="copyAllGeneratedText()" class="action-button px-4 py-2 text-sm font-bold flex items-center gap-1.5 shadow-[2px_2px_0_#1a202c]">
                        <i data-lucide="copy-check" class="w-4 h-4"></i>
                        <span id="copy-all-btn-text">Copy All Styles</span>
                    </button>
                </div>
            </div>

            <textarea id="text-input" rows="3"
                class="input-box w-full p-4 text-xl sm:text-2xl resize-none focus:outline-none focus:ring-4 focus:ring-yellow-400"
                placeholder="Type something to see it transform..." oninput="handleInput()">Type something to start</textarea>
        </div>

        <div id="styles-output" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
        </div>
    </div>

    <footer class="py-8 full-width-footer -mx-4 sm:-mx-8">
        <div class="max-w-6xl mx-auto text-center px-4 sm:px-8">
            <p class="text-xl sm:text-2xl font-extrabold text-gray-800 tracking-wider brand-text cursor-pointer" style="font-family: 'Luckiest Guy', cursive; text-shadow: 1px 1px 0 #fff;">
                A <span class="text-blue-600">FLEX CODER</span> Creation!
            </p>
            <p class="mt-2 text-sm text-gray-600 font-medium font-sans">
                &copy; <span id="current-year"></span> Flex Coder. All rights reserved.
            </p>
        </div>
    </footer>

        function handleInput() {
            updateStyles();
        }

        function toggleLanguageMenu(event) {
            if (event) event.stopPropagation();
            const dropdown = document.getElementById('lang-dropdown');
            dropdown.classList.toggle('hidden');
        }

        // Close dropdown when clicking outside
        window.addEventListener('click', function(e) {
            const dropdown = document.getElementById('lang-dropdown');
            const menuBtn = document.getElementById('menu-toggle-btn');
            if (dropdown && !dropdown.classList.contains('hidden')) {
                if (!dropdown.contains(e.target) && !menuBtn.contains(e.target)) {
                    dropdown.classList.add('hidden');
                }
            }
        });

            currentLanguage = lang;
            document.getElementById('lang-dropdown').classList.add('hidden');

            const checkEn = document.getElementById('check-en');
            const checkBn = document.getElementById('check-bn');
            const inputLabel = document.getElementById('input-label');
            const textInput = document.getElementById('text-input');
            const appHeading = document.getElementById('app-heading');
            const appSubheading = document.getElementById('app-subheading');
            const copyAllBtn = document.getElementById('copy-all-btn-text');

                checkEn.classList.add('hidden');
                checkBn.classList.remove('hidden');
                appHeading.textContent = "বাংলা ফন্ট জেনারেটর";
                appSubheading.textContent = "তৈরি করো ৩০+ আকর্ষণীয় প্রিমিয়াম বাংলা স্টাইল এক ক্লিকে।";
                inputLabel.textContent = "এখানে তোমার নাম বা টেক্সট লিখো:";
                inputLabel.classList.add('bangla-text');
                textInput.classList.add('bangla-text');
                textInput.placeholder = "এখানে তোমার নাম বা বাক্য লিখো...";
                if (textInput.value === 'Type something to start' || !textInput.value.trim()) {
                    textInput.value = "এখানে তোমার নাম লিখো";
                }
                copyAllBtn.textContent = "সবগুলো কপি করো";
            } else {
                checkEn.classList.remove('hidden');
                checkBn.classList.add('hidden');

                appSubheading.textContent = "Generate 80+ font styles instantly.";

                copyAllBtn.textContent = "Copy All Styles";

            { name: "Imperial Crest", fn: t => `♜⫷ ${mapWithCharMap(t.toUpperCase(), CHAR_MAPS.boldFraktur)} ⫸♜` },
            { name: "Luxury Diamond", fn: t => {
                const words = t.split(' ');
                if (words.length > 1) {
                    return `◆⟪ ${words[0].toUpperCase()} ⟫ ◈ ⟪ ${words.slice(1).join(' ').toUpperCase()} ⟫◆`;
                }
                return `◆⟪ ${t.toUpperCase()} ⟫ ◈ ⟪ ${t.toUpperCase()} ⟫◆`;
            }},
            { name: "Ultra Signature", fn: t => `乂⟡ ${mapWithCharMap(t.toUpperCase(), CHAR_MAPS.boldItalicSerif)} ⟡乂` },
            { name: "VIP Legend", fn: t => `♚『${t}』♚` },
            { name: "Star Royal", fn: t => `✦༺ ${t} ༻✦` },
            { name: "Mystic Seal", fn: t => `༒︎⟡ ${t} ⟡༒︎` },
            { name: "Phantom Crown", fn: t => `♕𓆩 ${t} 𓆪♕` },

            // 3. Cyberpunk & Gaming Styles
            { name: "Cyber Elite", fn: t => `⫷ ${mapWithCharMap(t.toUpperCase(), CHAR_MAPS.cyber)} ⫸` },
            { name: "Cyber Matrix", fn: t => `⌬ ${mapWithCharMap(t.toUpperCase(), CHAR_MAPS.cyber).split(' ').join(' ⫶ ')} ⌬` },
            { name: "Shadow Mark", fn: t => {
                const parts = t.split(' ');
                if (parts.length > 1) {
                    return `乂『${mapWithCharMap(parts[0].toUpperCase(), CHAR_MAPS.cyber)}』×『${mapWithCharMap(parts.slice(1).join(' ').toUpperCase(), CHAR_MAPS.cyber)}』乂`;
                }
                return `乂『${mapWithCharMap(t.toUpperCase(), CHAR_MAPS.cyber)}』乂`;
            }},
            { name: "Gaming Pro", fn: t => `亗〆 ${t} 亗` },
            { name: "Techno Rune", fn: t => `⟬ ${mapWithCharMap(t.toUpperCase(), CHAR_MAPS.cyber).split(' ').join(' ⌇ ')} ⟭` },
            { name: "Holographic", fn: t => `⌁ ${mapWithCharMap(t.toUpperCase(), CHAR_MAPS.cyber).split(' ').join(' ≋ ')} ⌁` },
            { name: "Obsidian", fn: t => {
                const parts = t.split(' ');
                if (parts.length > 1) {
                    return `◣ ${mapWithCharMap(parts[0].toUpperCase(), CHAR_MAPS.monospace)} ╳ ${mapWithCharMap(parts.slice(1).join(' ').toUpperCase(), CHAR_MAPS.monospace)} ◢`;
                }
                return `◣ ${mapWithCharMap(t.toUpperCase(), CHAR_MAPS.monospace)} ╳ ${mapWithCharMap(t.toUpperCase(), CHAR_MAPS.monospace)} ◢`;
            }},
            { name: "Phantom", fn: t => `𓂀 ${mapWithCharMap(t.toUpperCase(), CHAR_MAPS.cyber).split('').join(' ')} 𓂀` },
            { name: "Forbidden Luxe", fn: t => `⛧༺ ${mapWithCharMap(t.toUpperCase(), CHAR_MAPS.cyber)} ༻⛧` },
            { name: "Black Diamond", fn: t => `◆⟪ ${mapWithCharMap(t.toUpperCase(), CHAR_MAPS.cyber)} ⟫◆` },

            // 4. Special Effects & Decorations
            { name: "New Strikethrough", fn: t => t.split('').map(c => c + '\u0336').join('') },
            { name: "New Double Underline", fn: t => t.split('').map(c => c + '\u0333').join('') },
            { name: "Dot / Accent Mix", fn: t => {
                let out = '';
                for (let i = 0; i < t.length; i++) {
                    const char = t[i];
                    out += (i % 2 === 0) ? (CHAR_MAPS.boldFraktur[char] || char) : (CHAR_MAPS.script[char] || char);
                }
                return out;
            }},
            { name: "Double Struck Mix", fn: t => {
                let out = '';
                for (let i = 0; i < t.length; i++) {
                    const char = t[i];
                    out += (i % 2 === 0) ? transformText(char, 7) : (CHAR_MAPS.fraktur[char] || char);
                }
                return out;
            }},
            { name: "New Stars Decor", fn: t => `★彡 ${t} 彡★` },
            { name: "New Hearts Decor", fn: t => `♥ ${t} ♥` },
            { name: "New Arrow Mix", fn: t => mapWithCharMap(t, CHAR_MAPS.script).split(' ').join(' ➜ ') },
            { name: "Celestial", fn: t => `☾⋆ ${t} ⋆☽` },
            { name: "Glitch", fn: t => t.toUpperCase().split('').map(c => c + '\u0337').join('') },
            { name: "Elite Minimal", fn: t => `⟡ ${t.toUpperCase().split('').join(' ')} ⟡` }
        ];

        // ==========================================
        // SECTION B — BANGLA FONT STYLES (30 STYLES)
        // ==========================================
        const BANGLA_STYLES = [
            // 1. Royal Bangla Styles
            { name: "Royal King", format: t => `꧁༒☬ ${t} ☬༒꧂` },
            { name: "VIP Signature", format: t => `𓆩♛༺ ${t} ༻♛𓆪` },
            { name: "Dark Elite", format: t => `乂『${t}』乂` },
            { name: "Luxury Crown", format: t => `♛彡 ${t} 彡♛` },
            { name: "Royal Frame", format: t => `꧁༺ ${t} ༻꧂` },
            { name: "Shadow King", format: t => `◥꧁༒ ${t} ༒꧂◤` },
            { name: "Diamond Style", format: t => `◆❖ ${t} ❖◆` },
            { name: "Elite Signature", format: t => `༺𓆩 ${t} 𓆪༻` },
            { name: "VIP Legend", format: t => `♚『${t}』♚` },
            { name: "Mystic Bangla", format: t => `𖤍༒ ${t} ༒𖤍` },

            // 2. Gaming Bangla Styles
            { name: "Gaming Pro", format: t => `亗〆 ${t} 亗` },
            { name: "Premium X", format: t => `乂⟡ ${t} ⟡乂` },
            { name: "Dark Emperor", format: t => `♜⫷ ${t} ⫸♜` },
            { name: "Ultra Signature", format: t => `꧁𓊈𒆜 ${t} 𒆜𓊉꧂` },
            { name: "Secret Society", format: t => `◈༒ ${t} ༒◈` },
            { name: "Star Royal", format: t => `✦༺ ${t} ༻✦` },
            { name: "Celestial Bangla", format: t => `☾⋆ ${t} ⋆☽` },
            { name: "Phantom Crown", format: t => `♕𓆩 ${t} 𓆪♕` },
            { name: "Black Diamond", format: t => `◆⟪ ${t} ⟫◆` },
            { name: "Royal Blade", format: t => `⚔『${t}』⚔` },

            // 3. Bangla Decorative Styles
            { name: "Star Decoration", format: t => `★彡 ${t} 彡★` },
            { name: "Heart Decoration", format: t => `♥༺ ${t} ༻♥` },
            { name: "Arrow Decoration", format: t => `⫷ ${t} ⫸` },
            { name: "Minimal Premium", format: t => `⟡ ${t} ⟡` },
            { name: "Double Frame", format: t => `『༺ ${t} ༻』` },
            { name: "Diamond Frame", format: t => `◈⟦ ${t} ⟧◈` },
            { name: "Mystic Frame", format: t => `𖤍『${t}』𖤍` },
            { name: "Crown Frame", format: t => `♛꧁ ${t} ꧂♛` },
            { name: "Elite Frame", format: t => `𓆩 ${t} 𓆪` },
            { name: "VIP Frame", format: t => `亗『${t}』亗` }
        ];

        function generateCardHTML(styleName, transformedText, elementId, isBangla = false) {
            const fontClass = isBangla ? 'bangla-text' : '';
            return `
            <div class="p-4 font-style-box">
                <div>
                    <p class="text-sm font-semibold text-gray-700 mb-2 ${fontClass}">${styleName}</p>
                </div>
                <div class="flex items-center justify-between space-x-2 flex-grow min-h-[50px]">
                    <p id="${elementId}" class="text-lg sm:text-xl break-all flex-grow font-medium ${fontClass}">${transformedText}</p>
                    <div class="flex flex-shrink-0 space-x-2">
                        <button class="action-button p-2 text-sm rounded-lg hover:opacity-80 transition-all duration-100" onclick="copyText('${elementId}', this)" title="Copy">
                            <i data-lucide="copy" class="w-4 h-4"></i>
                        </button>
                        <button class="action-button p-2 text-sm rounded-lg bg-red-500 hover:opacity-80 transition-all duration-100" onclick="shareText('${elementId}', '${styleName}')" title="Share">
                            <i data-lucide="send" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            </div>
            `;
        }

        function updateStyles() {
            const outputContainer = document.getElementById('styles-output');
            let htmlContent = '';

            if (currentLanguage === 'bn') {
                const input = document.getElementById('text-input').value || 'এখানে তোমার নাম লিখো';
                BANGLA_STYLES.forEach((style, index) => {
                    const transformed = style.format(input);
                    htmlContent += generateCardHTML(style.name, transformed, `bn-style-${index}`, true);
                });
            } else {
                const input = document.getElementById('text-input').value || 'Type something to start';

                // 1. Existing 44 English Styles (100% Unaltered)
                STYLE_NAMES.forEach((name, index) => {
                    const transformed = transformText(input, index);
                    htmlContent += generateCardHTML(name, transformed, `style-${index}`, false);
                });

                // 2. New 45 English Styles (Added seamlessly)
                NEW_ENGLISH_STYLES.forEach((style, index) => {
                    const transformed = style.fn(input);
                    htmlContent += generateCardHTML(style.name, transformed, `new-en-style-${index}`, false);
                });
            }

            outputContainer.innerHTML = htmlContent;
            lucide.createIcons();
        }

        function copyAllGeneratedText() {
            const outputContainer = document.getElementById('styles-output');
            const pElements = outputContainer.querySelectorAll('p[id]');
            let allText = [];

            pElements.forEach(el => {
                if (el.textContent.trim()) {
                    allText.push(el.textContent.trim());
                }
            });

            if (allText.length === 0) return;

            const combined = allText.join('\n');
            performCopy(combined);
            const msg = currentLanguage === 'bn' ? 'সবগুলো স্টাইল সফলভাবে কপি করা হয়েছে!' : 'All styles copied to clipboard!';
            alertBox(msg, 'bg-emerald-600');
        }

        function performCopy(text) {
            const el = document.createElement('textarea');
            el.value = text;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
        }

        function copyText(elementId, button) {
            const textElement = document.getElementById(elementId);
            const text = textElement ? textElement.textContent : '';
            if (!text) return;

            performCopy(text);

            const originalHtml = button.innerHTML;
            const originalBg = button.style.backgroundColor;

            button.innerHTML = '<i data-lucide="check" class="w-4 h-4"></i>';
            button.style.backgroundColor = '#10B981';

            setTimeout(() => {
                button.innerHTML = originalHtml;
                button.style.backgroundColor = originalBg;
                lucide.createIcons();
            }, 1500);
        }

        function shareText(elementId, fontName) {
            const textElement = document.getElementById(elementId);
            const text = textElement ? textElement.textContent : '';
            if (!text) return;

            const shareData = {
                title: 'Check out this awesome text!',
                text: `${text} (Style: ${fontName})`,
                url: window.location.href,
            };

            if (navigator.share) {
                navigator.share(shareData)
                    .catch((error) => {
                        if (error.name === 'AbortError') {
                            return;
                        }
                    });
            } else {
                alertBox('Share not supported by your browser. Text copied instead!', 'bg-red-500');
                performCopy(shareData.text);
            }
        }

        function alertBox(message, bgColor) {
            let box = document.getElementById('custom-alert');
            if (!box) {
                box = document.createElement('div');
                box.id = 'custom-alert';
                box.classList.add('fixed', 'bottom-4', 'left-1/2', '-translate-x-1/2', 'p-4', 'rounded-lg', 'text-white', 'shadow-xl', 'z-50', 'transition-opacity', 'duration-300', 'opacity-0', 'min-w-[200px]', 'text-center');
                document.body.appendChild(box);
            }

            box.className = 'fixed bottom-4 left-1/2 -translate-x-1/2 p-4 rounded-lg text-white shadow-xl z-50 transition-opacity duration-300';
            box.classList.add(bgColor);
            box.textContent = message;

            requestAnimationFrame(() => {
                box.classList.remove('opacity-0');
                box.classList.add('opacity-100');
            });

            setTimeout(() => {
                box.classList.remove('opacity-100');
                box.classList.add('opacity-0');
            }, 3000);
        }

        window.onload = function() {
            updateStyles();
            document.getElementById('current-year').textContent = new Date().getFullYear();
            lucide.createIcons();
        };
    </script>
</body>
</html>
