    function copyToClipboard(buttonElement) {
        const textToCopy = buttonElement.parentElement.querySelector('.message-text').innerText;
        navigator.clipboard.writeText(textToCopy).then(() => {
            buttonElement.innerText = '✅';
            setTimeout(() => { buttonElement.innerText = '📋'; }, 2000);
        }).catch(err => { console.error('Copy failed:', err); });
    }

    function displayMessage(text, sender) {
        const messageWrapper = document.createElement('div');
        messageWrapper.classList.add('message', `${sender}-message`);

        const textElement = document.createElement('span');
        textElement.classList.add('message-text');
        textElement.innerText = text;
        messageWrapper.appendChild(textElement);

        if (sender === 'bot') {
            const copyButton = document.createElement('button');
            copyButton.classList.add('copy-btn');
            copyButton.innerHTML = '📋';
            copyButton.onclick = function() { copyToClipboard(this); };
            messageWrapper.appendChild(copyButton);
        }

        chatWindow.appendChild(messageWrapper);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    function sendMessage() {
        const messageText = userInput.value.trim();
        if (messageText === "") return;
        displayMessage(messageText, 'user');

            displayMessage(formattedResponse, 'bot');
        }, 500);
        
        userInput.value = "";
    }

    function levenshteinDistance(s1, s2) { /* অপরিবর্তিত */ s1 = s1.toLowerCase(); s2 = s2.toLowerCase(); const costs = []; for (let i = 0; i <= s1.length; i++) { let lastValue = i; for (let j = 0; j <= s2.length; j++) { if (i === 0) { costs[j] = j; } else { if (j > 0) { let newValue = costs[j - 1]; if (s1.charAt(i - 1) !== s2.charAt(j - 1)) { newValue = Math.min(Math.min(newValue, lastValue), costs[j]) + 1; } costs[j - 1] = lastValue; lastValue = newValue; } } } if (i > 0) costs[s2.length] = lastValue; } return costs[s2.length]; }
    function calculateSimilarity(s1, s2) { /* অপরিবর্তিত */ let longer = s1; let shorter = s2; if (s1.length < s2.length) { longer = s2; shorter = s1; } const longerLength = longer.length; if (longerLength === 0) { return 1.0; } return (longerLength - levenshteinDistance(longer, shorter)) / parseFloat(longerLength); }

    // --- getBotResponse ফাংশনে পরিবর্তন ---
    function getBotResponse(userText) {
        const lowerUserText = userText.toLowerCase();
        let bestMatch = { key: null, score: 0.0 };
        const SIMILARITY_THRESHOLD = 0.7;
        
        for (const key in knowledgeBase) {
            const similarity = calculateSimilarity(lowerUserText, key);
            if (similarity > bestMatch.score) {
                bestMatch = { key: key, score: similarity };
            }
        }
        
        if (bestMatch.score >= SIMILARITY_THRESHOLD) {
            return knowledgeBase[bestMatch.key]; // এখন পুরো {text, emoji} অবজেক্ট রিটার্ন হচ্ছে
        }
        
        // যদি কোনো উত্তর না পাওয়া যায়
        return { 
            text: "দুঃখিত, আমি আপনার প্রশ্নটি বুঝতে পারিনি। আপনি মেনু থেকে নতুন তথ্য যোগ করতে পারেন বা অন্যভাবে প্রশ্ন করতে পারেন।", 
            emoji: "🤔" 
        };
    }

    // --- saveNewKnowledge ফাংশনে পরিবর্তন ---
    function saveNewKnowledge() {
        const newQuestion = document.getElementById('new-question').value.trim().toLowerCase();
        const newAnswer = document.getElementById('new-answer').value.trim();
        if (!newQuestion || !newAnswer) { alert("প্রশ্ন এবং উত্তর উভয়ই পূরণ করতে হবে।"); return; }
        
        // নতুন কাঠামো অনুযায়ী সেভ করা হচ্ছে
        knowledgeBase[newQuestion] = { text: newAnswer, emoji: "✍️" }; 
        
        let customKnowledge = JSON.parse(localStorage.getItem('customKnowledge')) || {};
        customKnowledge[newQuestion] = { text: newAnswer, emoji: "✍️" };
        localStorage.setItem('customKnowledge', JSON.stringify(customKnowledge));
        
        alert("নতুন তথ্য সফলভাবে সংরক্ষণ করা হয়েছে!");
        document.getElementById('new-question').value = "";
        document.getElementById('new-answer').value = "";
        closePanel();
    }

    // --- বাকি ফাংশনগুলো অপরিবর্তিত ---
    const sidePanel = document.getElementById('side-panel'); const openPanelBtn = document.getElementById('open-panel-btn'); const closePanelBtn = document.getElementById('close-panel-btn'); const saveKnowledgeBtn = document.getElementById('save-knowledge-btn'); const overlay = document.getElementById('overlay');
    function loadCustomKnowledge() { const customKnowledge = JSON.parse(localStorage.getItem('customKnowledge')); if (customKnowledge) { Object.assign(knowledgeBase, customKnowledge); } }
    loadCustomKnowledge();
    userInput.addEventListener('keydown', (event) => { if (event.key === 'Enter') sendMessage(); });
    function openPanel() { sidePanel.classList.add('open'); overlay.classList.add('show'); }
    function closePanel() { sidePanel.classList.remove('open'); overlay.classList.remove('show'); }
    openPanelBtn.addEventListener('click', openPanel); closePanelBtn.addEventListener('click', closePanel); overlay.addEventListener('click', closePanel); saveKnowledgeBtn.addEventListener('click', saveNewKnowledge);

    // --- Initial Welcome Message ---
    displayMessage("হ্যালো! আমি আপনার উন্নত অফলাইন অ্যাসিস্ট্যান্ট। এখন আমি ইমোজি সহ উত্তর দিতে পারি। 😊", "bot");
</script>
